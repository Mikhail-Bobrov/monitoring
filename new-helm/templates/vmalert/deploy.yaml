{{- if .Values.vmalert.enable }}
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: vmalert
  name: vmalert
  namespace: mon
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: vmalert
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: vmalert
        stack: monitoring
    spec:
      containers:
      - args:
        - -datasource.url=http://victoria-single-svc:8428
        - -notifier.url=http://alertmanager-svc:9093
        - -rule=/etc/vmalert/rules.yaml
        image: victoriametrics/vmalert:v1.102.0
        imagePullPolicy: IfNotPresent
        name: vmalert
        resources:
          limits:
            cpu: 500m
            memory: 512M
          requests:
            cpu: 50m
            memory: 128M
        volumeMounts:
        - mountPath: /etc/vmalert
          name: rules-config
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - configMap:
          defaultMode: 420
          name: {{ .Values.vmalert.name -}}-config
        name: rules-config
{{- end }}